[project]
name = "ai-soc-assurance"
version = "0.1.0"
description = "Vendor-neutral assurance for AI SOCs: an independent benchmark harness with confidence intervals, a failure-mode catalogue with fault-injection tests, data-residency checks and Azure Policy, model risk cards and validation for SOC agents, a decision-audit replay tool and a product evaluation scorecard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
# The harness itself needs only PyYAML. The first system under test (azure-ai-soc) is not on PyPI; it is
# checked out at the commit pinned in config/sut.yaml and installed by scripts/fetch_sut.sh.
dependencies = [
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]

[project.scripts]
socassure = "socassure.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socassure"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py313"
extend-exclude = [".sut"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
